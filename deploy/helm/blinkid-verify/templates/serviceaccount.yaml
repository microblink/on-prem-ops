{{- if and .Values.blinkIdVerify.enabled .Values.blinkIdVerify.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "blinkidVerify.serviceAccountName" . }}
  labels:
    {{- include "blinkidVerify.labels" . | nindent 4 }}
  {{- with .Values.blinkIdVerify.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
